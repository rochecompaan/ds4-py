[project]
name = "ds4py"
version = "0.1.0"
description = "Checked native bindings and engine facade for ds4"
authors = [
    { name = "Roché Compaan", email = "roche@upfrontsoftware.co.za" }
]
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
agent = [
  "pydantic-ai-harness[cli]==0.59.0",
  "prompt-toolkit>=3.0.52,<4",
]

[project.scripts]
ds4py = "ds4py.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120

[tool.pyright]
include = ["src", "bench", "tests"]
typeCheckingMode = "standard"
reportMissingParameterType = "error"

[tool.ruff.lint]
select = [
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "ANN206",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "build: builds libds4 from DS4_SRC_UPSTREAM / DS4_SRC_FORK",
  "live: needs a model in DS4_TEST_MODEL",
]
