name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash          # adds -o pipefail

jobs:
  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
      - run: uv run --extra agent pyright
      - run: uv run --extra agent ruff check src bench tests

  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.14" }
          - { os: ubuntu-latest, python: "3.15" }
          - { os: macos-latest, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --extra agent pytest -m "not build and not live" -v
      - name: The wheel carries Makefile.lib
        run: |
          uv build --wheel
          unzip -l dist/*.whl | grep -q 'ds4py/abi/Makefile.lib'

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pin: upstream, src_var: DS4_SRC_UPSTREAM }
          - { pin: fork, src_var: DS4_SRC_FORK }
    runs-on: ubuntu-latest
    env:
      PIN: ${{ matrix.pin }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
      - name: Read the pin
        id: pin
        run: |
          uv run python - "$PIN" >> "$GITHUB_OUTPUT" <<'EOF'
          import sys
          from ds4py.abi import pins
          pin = {"upstream": pins.UPSTREAM, "fork": pins.FORK}[sys.argv[1]]
          print("repo=" + pin.repo.removeprefix("https://github.com/").removesuffix(".git"))
          print("commit=" + pin.commit)
          EOF
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.commit }}
          path: ds4-src
          persist-credentials: false
      - name: Build tests
        run: env "${{ matrix.src_var }}=$GITHUB_WORKSPACE/ds4-src" uv run --extra agent pytest -m build -v
      - name: ds4py build and ds4py check
        run: |
          if [ "$PIN" = fork ]; then export PYTHONPATH="$GITHUB_WORKSPACE/tests/fixtures/ext_site"; fi
          uv run ds4py build --src ds4-src --backend cpu --out out
          uv run ds4py check --lib out/libds4.so
