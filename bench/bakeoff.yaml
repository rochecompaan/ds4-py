repository_tasks:
  - id: repo-glm-close
    patch: patches/glm-off-by-one.patch
    visible_test: tests/engine/tool_syntax/test_glm.py
    prompt: |
      Fix the planted off-by-one defect in GLM's incremental </arg_value> close
      handling. A close delimiter split across input chunks must be recognized,
      including a split immediately before its final byte. Keep the public parser
      behavior unchanged otherwise. Run tests/engine/tool_syntax/test_glm.py and
      do not weaken or edit the regression tests.
  - id: repo-ctx-command
    grader: graders/test_ctx_command.py
    prompt: |
      Add a /ctx slash command to the existing interactive command registry.
      With runtime.ctx_used=123 and runtime.ctx=1000, it must return a status
      containing "123 used" and "877 remaining". Add the matching AgentRuntime
      context properties if needed. /ctx must appear in / completion, take no
      arguments, and must not append history, mutate/save/switch the session, or
      call model/native generation. Follow the existing built-in command style.
